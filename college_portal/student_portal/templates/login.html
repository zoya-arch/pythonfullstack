<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <form method="POST">
      {% csrf_token %}
      <h1>Username</h1>
      <input type="text" name="username">
      <h1>Password</h1>
      <input type="password" name="password">
      <button type="submit">Login</button>
    </form>
</body>
</html>
